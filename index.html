<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <title>Star Catcher · Tiny Arcade</title>
  <!-- Inline pixel-star favicon, so there's no image file to fetch. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7' shape-rendering='crispEdges'%3E%3Cpath fill='%23ffd84a' d='M3 0h1v3h3v1H6v1H5v2H4V6H3v1H2V5H1V4H0V3h3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arcade">
    <header class="marquee">
      <h1>Tiny Arcade</h1>
      <p>Star Catcher</p>
    </header>

    <!-- The whole game is drawn on this one canvas (see src/main.js). -->
    <div class="screen">
      <canvas id="game" aria-label="Star Catcher game. Use the arrow keys or touch to move."></canvas>
      <!-- Shown only on touch screens (see style.css). P or Esc pauses on desktop. -->
      <button id="pause" class="pause-button" type="button" aria-label="Pause game" aria-pressed="false">PAUSE</button>
    </div>

    <!-- Sound toggle. Press M to flip it from the keyboard too. -->
    <button id="mute" class="mute-button" type="button" aria-label="Mute sound effects" aria-pressed="false">SOUND ON</button>

    <p class="help">
      <span class="key">&larr;</span><span class="key">&rarr;</span> or drag to move &middot;
      catch <b class="star">stars</b>, dodge <b class="rock">rocks</b> &middot;
      <span class="key">M</span> sound
    </p>

    <footer class="footer">Star Catcher <span class="version">v0.1.0</span></footer>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
